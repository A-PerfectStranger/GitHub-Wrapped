name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check app.js && node --check api/wrapped.js && node --check viz/galaxy.js && node --check viz/wordcloud.js && node --check viz/timeline.js && node --check scripts/dev.mjs
